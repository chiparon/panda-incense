<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>熊猫烧香 · 动作库</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:#262e2b;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:42px 30px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #b9c0b5;padding-bottom:24px}h1{font-size:38px;letter-spacing:3px;margin:0}small{color:#68776b}button{font:inherit;cursor:pointer;border:1px solid #b5c0b4;border-radius:24px;padding:9px 18px;background:#fff9;margin:5px}button:hover,button[aria-pressed=true]{background:#244e40;color:white}.hero{display:grid;grid-template-columns:360px 1fr;gap:50px;align-items:center;padding:30px 0}.stage{background:radial-gradient(ellipse at 50% 80%,#c7d1bd88,transparent 65%);text-align:center}.stage img{width:288px;height:312px;object-fit:contain;cursor:pointer}h2{font-size:22px;margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{padding:12px;text-align:center;border:1px solid #cbd0c4;border-radius:14px;background:#fff6}.card img{width:100%;max-width:192px;aspect-ratio:192/208;object-fit:contain}.card b{display:block}.card small{font-size:12px}footer{margin-top:30px;border-top:1px solid #c5cbbf;padding-top:20px;font-size:13px}a{color:#245640}@media(max-width:800px){.hero{grid-template-columns:1fr;gap:0}.cards{grid-template-columns:repeat(2,1fr)}header{display:block}}
</style><main><header><div><small>CODEX DESKPET / 熊猫烧香</small><h1>认真敲代码，闲时拜一拜。</h1></div><small>原版 GIF + 新动作 · 点击熊猫试试</small></header>
<section class="hero"><div class="stage"><img id="pet" alt="熊猫烧香桌宠，点击捧腹大笑" tabindex="0" role="button"></div><div><h2 id="state">点头烧香</h2><p id="description">保留参考 GIF 的原始动作，待机时循环播放。</p><div id="controls"></div><small id="note">这里模拟状态；本地运行器读取当前项目的 Codex 会话事件。</small></div></section><section class="cards" id="cards"></section>
<footer>原始参考：<a href="pandaincence.gif">GIF 原图（未改动）</a> · <a href="pandaincense.jpg">JPG 原图（未改动）</a> · <a href="panda-incense-native.zip">下载原生宠物包</a><p>原生 Codex 点击打开主窗口，无法通过 pet.json 自定义。点击大笑由本地运行器实现；原生包将大笑放在 waving 行。工作、等待、完成、失败与拖动使用原生状态行。</p></footer></main>
<script>
const library=[['incense','点头烧香','待机 · 原 GIF 8 帧',8],['roll-right','向右打滚','右拖动 / 闲时活动',8],['roll-left','向左打滚','左拖动',8],['laugh','捧腹大笑','点击 · 结束后恢复工作状态',8],['jump','开心跳跃','闲时活动',8],['recover','擦汗振作','任务中断 / 失败',8],['bamboo','抱竹等待','等待输入 / 审批',8],['laptop','拿出电脑打字','工作中 · 打字循环',8],['review','检查清单','任务完成',8],['gaze','环顾四周','16 个视线姿态',16]];
const pet=document.querySelector('#pet'),cards=document.querySelector('#cards');let base='incense',action=base,index=0,until=0;
const src=(name,i)=>`actions/${name}/${String(i).padStart(2,'0')}.png`;
function choose(name,temporary=false){if(!temporary)base=name;action=name;index=0;until=temporary?Date.now()+2600:0;const row=library.find(r=>r[0]===name);document.querySelector('#state').textContent=row[1];document.querySelector('#description').textContent=row[2];document.querySelectorAll('#controls button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.name===name));pet.dataset.action=name;pet.src=src(name,0)}
for(const [name,label,desc,count] of library){const b=document.createElement('button');b.textContent=label;b.dataset.name=name;b.onclick=()=>choose(name);document.querySelector('#controls').append(b);const card=document.createElement('article');card.className='card';card.innerHTML=`<img alt="${label}" src="${src(name,0)}"><b>${label}</b><small>${desc}</small>`;cards.append(card)}
pet.onclick=()=>choose('laugh',true);pet.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet.click()}};
let tick=0;setInterval(()=>{if(until&&Date.now()>until)choose(base);const count=library.find(r=>r[0]===action)[3];pet.src=src(action,index);index++;if(index>=count)index=action==='laptop'?2:0;library.forEach(([name,,,count],i)=>cards.children[i].querySelector('img').src=src(name,tick%count));tick++},140);choose('incense');
</script></html>
